# Fails when the certificate can't be read or expires within DAYS days.
name = "TLS certificate expiry"
description = '''
Checks once a day that a site's TLS certificate is valid for at least DAYS more days.
Fails when it expires sooner, or when the certificate can't be read.
Set HOST to the domain, without https://.
'''
author = "Jonathan Fontes"
website = "https://jonathan.pt"
category = "Monitoring"
command = '''
cert=$(openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null 2>/dev/null \
  | openssl x509 -noout -enddate -checkend $((DAYS * 86400)))
rc=$?
echo "$HOST: ${cert:-no certificate}"
exit $rc
'''
at = ["09:00"]
timeout = 1

[environment]
HOST = "example.com"
DAYS = "14"
